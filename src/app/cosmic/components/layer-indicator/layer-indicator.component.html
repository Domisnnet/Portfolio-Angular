<div class="layer-indicator" aria-hidden="true">
  <section class="hud-panel">
    <span class="hud-label">REGION</span><strong class="hud-value">{{ cosmic.regionName() }}</strong>
  </section>
  <section class="hud-panel">
    <div class="hud-row">
      <span>DISTANCE</span>
      <strong>{{ cosmic.distance() }}</strong>
    </div>
    <div class="hud-row">
      <span>PROJECTS</span><strong>{{ cosmic.projects() }} / {{ cosmic.totalProjects() }}</strong>
    </div>
  </section>
  <section class="hud-panel">
    <div class="hud-row">
      <span>SIGNAL</span>
      <div class="signal-bars">
        <span [class.active]="cosmic.signal() >= 20"></span>
        <span [class.active]="cosmic.signal() >= 40"></span>
        <span [class.active]="cosmic.signal() >= 60"></span>
        <span [class.active]="cosmic.signal() >= 80"></span>
        <span [class.active]="cosmic.signal() >= 100"></span>
      </div>
    </div>
    <div class="hud-row">
      <span>STATUS</span><strong>{{ cosmic.status() }}</strong>
    </div>
  </section>
</div>
