@for (meteor of meteors(); track meteor.id) {
  <span
    class="meteor"
    [style.--meteor-x]="meteor.x + 'vw'"
    [style.--meteor-y]="meteor.y + 'vh'"
    [style.--meteor-size]="meteor.size"
    [style.--meteor-speed]="meteor.speed"
    [style.--meteor-angle]="meteor.angle + 'deg'"
    [style.--meteor-delay]="meteor.delay"
    [style.--meteor-intensity]="meteor.intensity"
    [style.--meteor-blur]="meteor.blur"
  >
    <span class="meteor__scale">
      <img class="meteor__image" [src]="meteor.image" alt="" decoding="async" draggable="false" />
    </span>
  </span>
}
