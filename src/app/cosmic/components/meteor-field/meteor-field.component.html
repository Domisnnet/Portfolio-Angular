<div class="meteor-field" aria-hidden="true">
  <app-meteor-layer class="meteor-field__layer meteor-field__layer--far" layer="far" [meteors]="farMeteors" />
  <app-meteor-layer class="meteor-field__layer meteor-field__layer--mid" layer="mid" [meteors]="midMeteors" />
  <app-meteor-layer class="meteor-field__layer meteor-field__layer--near" layer="near" [meteors]="nearMeteors" />
</div>
