<section class="admin-section container" data-cosmic-effects="minimal">
  <article class="admin-card" @cardEnter>
    <div class="admin-body">
      <h2>Painel Administrativo</h2>
      <p>Gerencie as mensagens recebidas pelo formulário de contato.</p>
      <div class="form-group">
        <label>Usuário logado</label>
        <p class="user-email">{{ (user$ | async)?.email }}</p>
        <div class="form-mail">
          <app-button type="button" size="md" [loading]="loading" [disabled]="loading" (click)="logout()">
            Logout
          </app-button>
        </div>
      </div>
      <ng-container *ngIf="contacts$ | async as contacts; else loadingTpl">
        <div class="messages-list" *ngIf="contacts.length; else emptyState">
          <article class="message-card" *ngFor="let contact of contacts; trackBy: trackByContactId">
            <header class="message-header">
              <div class="message-user">
                <h3>{{ contact.name }}</h3>
                <span>{{ contact.email }}</span>
              </div>
            </header>
            <div class="message-content">
              {{ contact.message }}
            </div>
            <footer class="message-actions">
              <app-button type="button" size="sm" variant="outline" (click)="deleteMessage(contact.id!)">
                Excluir
              </app-button>
            </footer>
          </article>
        </div>
      </ng-container>
      <ng-template #emptyState>
        <div class="empty-state">
          <p>Nenhuma mensagem recebida até o momento.</p>
        </div>
      </ng-template>
      <ng-template #loadingTpl>
        <div class="empty-state">
          <p>Carregando mensagens...</p>
        </div>
      </ng-template>
    </div>
  </article>
</section>
