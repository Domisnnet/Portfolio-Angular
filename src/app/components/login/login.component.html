<section class="login-section container" data-cosmic-effects="minimal">
  <article class="login-card" @cardEnter>
    <div class="login-body">
      <h2>Área Restrita</h2>
      <p>Faça login para acessar o painel administrativo.</p>
      <form (ngSubmit)="loginEmail()" #loginForm="ngForm" novalidate autocomplete="on">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            required
            placeholder="seu-email@dominio.com"
            autocomplete="username"
          />
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="password"
            required
            placeholder="Sua senha"
            autocomplete="current-password"
          />
        </div>
        <div class="form-mail">
          <app-button
            type="submit"
            size="md"
            iconLeft="fa-solid fa-right-to-bracket"
            ariaLabel="Entrar com email"
            [loading]="loading"
          >
            Entrar com Email
          </app-button>
        </div>
      </form>
      <div class="form-mail">
        <app-button type="button" size="md" [loading]="loading" [disabled]="loading" (click)="loginGoogle()">
          <span class="google-icon"></span>
          Entrar com Google
        </app-button>
      </div>
    </div>
  </article>
</section>
