<section class="login">
  <h2>Login Admin</h2>
  <input [(ngModel)]="email" placeholder="Email" type="email">
  <input [(ngModel)]="password" placeholder="Senha" type="password">
  <button (click)="loginEmail()">Entrar com Email</button>
  <button (click)="loginGoogle()">Entrar com Google</button>
</section>
