<section class="contact-section container" data-cosmic-effects="minimal">
  <article class="contact-card" @cardEnter>
    <div class="contact-body">
      <h2>Contato</h2>
      <p>Envie sua mensagem e retornarei o mais breve possível.</p>
      <form (ngSubmit)="submitForm()" novalidate autocomplete="on">
        <div class="form-group">
          <label for="name">Nome</label>
          <input
            id="name"
            name="name"
            type="text"
            [(ngModel)]="name"
            required
            autocomplete="name"
            placeholder="Seu nome"
          />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            required
            autocomplete="email"
            placeholder="seu-email@dominio.com"
          />
        </div>
        <div class="form-group">
          <label for="message">Mensagem</label>
          <textarea
            id="message"
            name="message"
            [(ngModel)]="message"
            required
            autocomplete="off"
            placeholder="Escreva sua mensagem"
            rows="6"
          ></textarea>
        </div>
        <div class="form-mail">
          <button
            class="btn solid md"
            type="submit"
          >
            Enviar Mensagem
          </button>
        </div>
      </form>
    </div>
  </article>
</section>
