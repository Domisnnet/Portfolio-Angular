<section class="deep-container" data-cosmic-effects="minimal">
  <app-cosmic-root>
    <header class="page-header">
      <h1>Deep Space</h1>
      <p>Artefatos</p>
    </header>
    <div class="deep-grid">
      @for (project of projects(); track project.title; let i = $index) {
        <app-project-card
          [project]="project"
          [index]="i"
          [style.--rotation]="i % 2 === 0 ? '2deg' : '-2deg'"
        ></app-project-card>
      }
    </div>
  </app-cosmic-root>
</section>
