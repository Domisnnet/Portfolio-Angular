<section class="deep-space-container" data-cosmic-effects="full">
  <app-cosmic-root>
    <header class="deep-space-header">
      <h1 class="deep-space-header__title">Deep Space</h1>
      <p class="deep-space-header__description">Seja Bem Vindo ao próximo Universo.</p>
    </header>
    <div class="deep-space-grid">
      @for (project of projects(); track project.title; let i = $index) {
        <app-project-card 
          [project]="project" [index]="i" [style.--rotation]="i % 2 === 0 ? '2deg' : '-2deg'"
        ></app-project-card>
      }
    </div>
  </app-cosmic-root>  
</section>
