<app-hero></app-hero>
<section class="stack-section" data-cosmic-effects="minimal">
  <div class="stack-container no-padding-top">
    <app-my-title [config]="headerData"></app-my-title>
    @for (category of categories; track category) {
      <div class="stack-block" [class]="category">
        <h3>{{ category | titlecase }}</h3>
        <div class="pill-grid">
          @for (pill of stackService.getPersonalStack(category); track pill.key) {
            <app-stack-pill [label]="pill.label" [iconPath]="pill.iconPath" [category]="pill.category" />
          }
        </div>
      </div>
    }
  </div>
</section>
